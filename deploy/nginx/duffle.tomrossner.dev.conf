# /etc/nginx/sites-available/duffle.tomrossner.dev
# Certbot adds the 443 server and the HTTP -> HTTPS redirect to this file:
#   sudo certbot --nginx -d duffle.tomrossner.dev

upstream duffle_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name duffle.tomrossner.dev;

    # Server actions accept up to 6 MB (next.config.ts); leave room for form overhead.
    client_max_body_size 8m;

    location / {
        proxy_pass http://duffle_app;
        proxy_http_version 1.1;

        # Overwrite, never append: the app trusts these for rate limits and auth URLs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Let App Router streaming reach the browser.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
